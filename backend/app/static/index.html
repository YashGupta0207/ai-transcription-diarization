<script>
  const $ = (id) => document.getElementById(id);

  // Hardcoded connection settings - not shown/editable by end users.
  const backendUrl = window.location.origin;
  const apiKey = "dev-desktop-key-change-me";
  const providerName = "deepgram";

  let selectedFile = null;
  let activeJobId = null;
  let jobsCache = [];

  // Tracks what's already rendered so we don't rebuild the transcript view
  // on every 4-second poll (that was causing visible flicker/blinking).
  let lastRenderedJobId = null;
  let lastRenderedStatus = null;

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function headers() {
    return { 'X-API-Key': apiKey };
  }

  // ---- Upload ----
  $('dropzone').addEventListener('click', () => $('fileInput').click());
  $('dropzone').addEventListener('dragover', (e) => { e.preventDefault(); $('dropzone').classList.add('drag'); });
  $('dropzone').addEventListener('dragleave', () => $('dropzone').classList.remove('drag'));
  $('dropzone').addEventListener('drop', (e) => {
    e.preventDefault();
    $('dropzone').classList.remove('drag');
    if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
  });
  $('fileInput').addEventListener('change', (e) => {
    if (e.target.files.length) setFile(e.target.files[0]);
  });
  function setFile(file) {
    selectedFile = file;
    $('fname').textContent = file.name;
    $('uploadBtn').disabled = false;
  }

  $('uploadBtn').addEventListener('click', async () => {
    if (!selectedFile) return;
    $('uploadBtn').disabled = true;
    $('uploadBtn').textContent = 'Uploading…';

    const fd = new FormData();
    fd.append('file', selectedFile);
    fd.append('provider', providerName);

    try {
      const resp = await fetch(`${backendUrl}/upload`, { method: 'POST', headers: headers(), body: fd });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.detail || `Upload failed (${resp.status})`);
      }
      const data = await resp.json();
      toast('Job queued successfully');
      selectedFile = null;
      $('fname').textContent = '';
      $('fileInput').value = '';
      $('uploadBtn').textContent = 'Upload & Start Job';
      $('uploadBtn').disabled = true;
      await loadJobs();
      selectJob(data.job_id);
    } catch (e) {
      toast(e.message);
      $('uploadBtn').textContent = 'Upload & Start Job';
      $('uploadBtn').disabled = false;
    }
  });

  // ---- Health ----
  async function checkHealth() {
    const pill = $('statusPill');
    try {
      const resp = await fetch(`${backendUrl}/health`);
      if (!resp.ok) throw new Error();
      const data = await resp.json();
      pill.className = 'status-pill online';
      $('statusText').textContent = `online · queue: ${data.queue_length} · failed: ${data.failed_jobs}`;
    } catch {
      pill.className = 'status-pill offline';
      $('statusText').textContent = 'backend unreachable';
    }
  }

  // ---- Job list ----
  async function loadJobs() {
    try {
      const resp = await fetch(`${backendUrl}/jobs?limit=100`, { headers: headers() });
      if (!resp.ok) return;
      const data = await resp.json();
      jobsCache = data.jobs || [];
      renderJobList();
      if (activeJobId) {
        const job = jobsCache.find(j => j.id === activeJobId);
        if (job) renderDetail(job);
      }
    } catch { }
  }

  function renderJobList() {
    const ul = $('jobList');
    if (!jobsCache.length) {
      ul.innerHTML = '<li class="empty">No jobs yet</li>';
      return;
    }
    ul.innerHTML = '';
    jobsCache.forEach(job => {
      const li = document.createElement('li');
      li.className = job.id === activeJobId ? 'active' : '';
      li.innerHTML = `<div class="fn">${escapeHtml(job.original_filename)}</div><span class="badge ${job.status}">${job.status}</span>`;
      li.addEventListener('click', () => selectJob(job.id));
      ul.appendChild(li);
    });
  }

  function selectJob(jobId) {
    activeJobId = jobId;
    // Force a fresh render when the user explicitly clicks a job, even if
    // its status hasn't changed since the last poll.
    lastRenderedJobId = null;
    renderJobList();
    const job = jobsCache.find(j => j.id === jobId);
    if (job) renderDetail(job);
  }

  async function renderDetail(job) {
    if (!job) return;

    // Skip re-rendering entirely if nothing meaningful has changed since the
    // last render - this is what stops the flicker on completed jobs while
    // polling continues in the background.
    if (job.id === lastRenderedJobId && job.status === lastRenderedStatus) {
      return;
    }
    lastRenderedJobId = job.id;
    lastRenderedStatus = job.status;

    $('emptyDetail').style.display = 'none';
    $('detailContent').style.display = 'block';
    $('detailFilename').textContent = job.original_filename;
    $('detailMeta').innerHTML = `<span class="badge ${job.status}">${job.status}</span> &nbsp; provider: ${job.provider} &nbsp; created: ${new Date(job.created_at).toLocaleString()}`;

    $('errorBox').style.display = 'none';
    $('progressbar').style.display = 'none';
    $('exportRow').style.display = 'none';
    $('transcriptBox').innerHTML = '';

    if (['queued', 'uploading', 'processing', 'retrying'].includes(job.status)) {
      $('progressbar').style.display = 'block';
      $('transcriptBox').innerHTML = '<div class="empty-state">Processing on the server — this page can be closed and reopened anytime.</div>';
    } else if (job.status === 'failed') {
      $('errorBox').style.display = 'block';
      $('errorBox').textContent = job.error_message || 'Unknown error';
    } else if (job.status === 'cancelled') {
      $('transcriptBox').innerHTML = '<div class="empty-state">This job was cancelled.</div>';
    } else if (job.status === 'completed') {
      $('exportRow').style.display = 'flex';
      try {
        const resp = await fetch(`${backendUrl}/jobs/${job.id}/result`, { headers: headers() });
        const data = await resp.json();
        $('transcriptBox').innerHTML = formatTranscript(data.segments || []);
      } catch {
        $('transcriptBox').innerHTML = '<div class="empty-state">Could not load transcript.</div>';
      }
    }
  }

  function formatTranscript(segments) {
    if (!segments.length) return '<div class="empty-state">Empty transcript.</div>';
    let html = '';
    let currentSpeaker = null;
    segments.forEach(seg => {
      if (seg.speaker !== currentSpeaker) {
        html += `<span class="speaker">${escapeHtml(seg.speaker)}</span>`;
        currentSpeaker = seg.speaker;
      }
      html += escapeHtml(seg.text) + ' ';
    });
    return html;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  // ---- Actions ----
  $('cancelBtn').addEventListener('click', async () => {
    if (!activeJobId) return;
    await fetch(`${backendUrl}/jobs/${activeJobId}/cancel`, { method: 'POST', headers: headers() });
    toast('Job cancelled');
    lastRenderedJobId = null;
    loadJobs();
  });

  $('deleteBtn').addEventListener('click', async () => {
    if (!activeJobId) return;
    if (!confirm('Delete this job permanently?')) return;
    await fetch(`${backendUrl}/jobs/${activeJobId}`, { method: 'DELETE', headers: headers() });
    toast('Job deleted');
    activeJobId = null;
    lastRenderedJobId = null;
    $('detailContent').style.display = 'none';
    $('emptyDetail').style.display = 'block';
    loadJobs();
  });

  $('exportBtn').addEventListener('click', async () => {
    if (!activeJobId) return;
    const fmt = $('exportFormat').value;
    try {
      const resp = await fetch(`${backendUrl}/jobs/${activeJobId}/export?format=${fmt}`, { headers: headers() });
      const text = await resp.text();
      const blob = new Blob([text], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `transcript.${fmt}`;
      a.click();
    } catch (e) {
      toast('Export failed');
    }
  });

  // ---- Polling ----
  checkHealth();
  loadJobs();
  setInterval(checkHealth, 8000);
  setInterval(loadJobs, 4000);
</script>
